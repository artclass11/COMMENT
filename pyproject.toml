[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecommit"
version = "1.1.0"
description = "Voice-aware Conventional Commit generator for Git"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "COMMENT contributors" }]
keywords = ["git", "commit", "conventional-commits", "ai", "voice", "whisper", "ollama", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "sounddevice>=0.5.2,<1",
  "scipy>=1.13,<2",
  "openai-whisper>=20240930,<20270000",
]

[project.scripts]
vibecommit = "VibeCommit:main"

[tool.setuptools]
py-modules = ["VibeCommit"]
